# PepiCloud - Taller 2 Sistemas Distribuidos (CECAR)
name: pepicloud

# Configuracion comun de las instancias LocalStack (ancla YAML)
x-localstack: &localstack
  image: localstack/localstack:latest
  restart: unless-stopped
  networks: [pepicloud]
  healthcheck:
    # Sana cuando termino de ejecutar sus scripts de inicio (ready.d)
    test: ["CMD", "python3", "-c", "import json,sys,urllib.request as u; d=json.load(u.urlopen('http://localhost:4566/_localstack/init/ready')); ok=d.get('completed') and all(s.get('state')!='ERROR' for s in d.get('scripts',[])); sys.exit(0 if ok else 1)"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 20s

x-localstack-env: &localstack-env
  LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Falta LOCALSTACK_AUTH_TOKEN en .env}
  AWS_DEFAULT_REGION: us-east-1

# Configuracion comun de los servicios Python (APIs y worker)
x-app: &app
  build: ./app
  image: pepicloud-app:latest
  networks: [pepicloud]
  # Resolver DNS con timeout corto: un contenedor apagado se detecta en ~1 s
  dns_opt: ["timeout:1", "attempts:1"]
  secrets: [aws_credentials]
  environment: &app-env
    AWS_DEFAULT_REGION: us-east-1
    AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    S3_A_ENDPOINT: http://minio-a:9000
    S3_A_BUCKET: pepicloud-docs-a
    S3_B_ENDPOINT: http://minio-b:9000
    S3_B_BUCKET: pepicloud-docs-b
    S3_BACKUP_ENDPOINT: http://minio-backup:9000
    S3_BACKUP_BUCKET: pepicloud-docs-backup
    KMS_ENDPOINT: http://localstack-kms:4566
    KMS_KEY_ALIAS: alias/pepicloud-docs
    RETENCION_MINUTOS: ${RETENCION_MINUTOS:-30}
    DB_HOST: postgres
    DB_NAME: pepicloud

# Configuracion comun de las instancias MinIO (almacenamiento de objetos persistente)
x-minio: &minio
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  restart: unless-stopped
  networks: [pepicloud]
  command: ["server", "/data"]
  environment:
    MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
    MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
  secrets: [minio_root_user, minio_root_password]
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:

  # -------------------------------------- seguridad: KMS + Secrets Manager
  localstack-kms:
    <<: *localstack
    container_name: pepicloud-localstack-kms
    hostname: localstack-kms
    environment:
      <<: *localstack-env
      SERVICES: kms,secretsmanager
    ports: ["127.0.0.1:4569:4566"]
    secrets:
      - pg_registro_password
      - pg_consulta_password
      - pg_worker_password
      - kms_key_material
    volumes:
      - ./localstack/init-kms.sh:/etc/localstack/init/ready.d/10-init-kms.sh:ro

  # ------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:17
    container_name: pepicloud-postgres
    hostname: postgres
    restart: unless-stopped
    networks: [pepicloud]
    environment:
      POSTGRES_DB: pepicloud
      POSTGRES_USER: pepicloud_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password   # ruta, no la contrasena
      TZ: America/Bogota
    # Necesario para los backups incrementales nativos de PostgreSQL 17 (fase 5)
    command: ["postgres", "-c", "wal_level=replica", "-c", "summarize_wal=on",
              "-c", "max_wal_senders=5", "-c", "timezone=America/Bogota"]
    secrets:
      - pg_admin_password
      - pg_replicador_password
      - pg_registro_password
      - pg_consulta_password
      - pg_worker_password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepicloud_admin -d pepicloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------- contenedor de pruebas (solo bajo demanda)
  app-pruebas:
    <<: *app
    container_name: pepicloud-app-pruebas
    profiles: ["pruebas"]     # no arranca con "up"; se ejecuta con "run"
    volumes:
      - ./app/comun:/app/comun:ro
      - ./app/pruebas:/app/pruebas:ro

  # ------------------------------------------------- API de registro (carga)
  api-registro:
    <<: *app
    container_name: pepicloud-api-registro
    hostname: api-registro
    restart: unless-stopped
    command: ["uvicorn", "api_registro.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # sin puertos publicados: solo se accede a traves de su portal
    secrets: [aws_credentials, api_admin_token]
    depends_on:
      postgres:          {condition: service_healthy}
      localstack-kms:    {condition: service_healthy}
      minio-a:           {condition: service_healthy}
      minio-b:           {condition: service_healthy}
      s3-init:           {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------- API de consulta (lectura)
  api-consulta:
    <<: *app
    container_name: pepicloud-api-consulta
    hostname: api-consulta
    restart: unless-stopped
    command: ["uvicorn", "api_consulta.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # sin puertos publicados: solo se accede a traves de su portal
    depends_on:            # NO depende de A, B ni backup: debe funcionar con copias caidas
      postgres:       {condition: service_healthy}
      localstack-kms: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------- worker de backup, reparacion y limpieza
  worker-backup:
    <<: *app
    container_name: pepicloud-worker-backup
    hostname: worker-backup
    restart: unless-stopped
    command: ["python", "-m", "worker_backup.main"]
    environment:
      <<: *app-env
      WORKER_INTERVALO: "15"
    depends_on:
      postgres:       {condition: service_healthy}
      localstack-kms: {condition: service_healthy}

  # ------------------------------------------------- Portal web de registro
  ui-registro:
    image: nginx:1.27-alpine
    container_name: pepicloud-ui-registro
    hostname: ui-registro
    restart: unless-stopped
    networks: [pepicloud]
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./ui/registro:/usr/share/nginx/html:ro
      - ./ui/nginx-registro.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-registro: {condition: service_healthy}

  # ------------------------------------------------- Portal web de consulta
  ui-consulta:
    image: nginx:1.27-alpine
    container_name: pepicloud-ui-consulta
    hostname: ui-consulta
    restart: unless-stopped
    networks: [pepicloud]
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./ui/consulta:/usr/share/nginx/html:ro
      - ./ui/nginx-consulta.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-consulta: {condition: service_healthy}

  # ------------------------------------- backups de PostgreSQL (full + incrementales)
  pg-backup:
    build: ./pg-backup
    image: pepicloud-pg-backup:latest
    container_name: pepicloud-pg-backup
    hostname: pg-backup
    restart: unless-stopped
    networks: [pepicloud]
    environment:
      TZ: America/Bogota
      BACKUP_INTERVALO_MIN: "10"
    secrets: [pg_replicador_password]
    volumes:
      - pg_backups:/backups      # volumen distinto al de la base en operacion
      - pg_restore:/restore
    depends_on:
      postgres: {condition: service_healthy}

  # ------------------------- instancia para probar la restauracion (solo bajo demanda)
  postgres-restore:
    image: postgres:17
    container_name: pepicloud-postgres-restore
    hostname: postgres-restore
    profiles: ["restore"]
    networks: [pepicloud]
    environment:
      PGDATA: /var/lib/postgresql/restore/data
      TZ: America/Bogota
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pg_restore:/var/lib/postgresql/restore

  # ------------------------------------------- MinIO: copia A (principal)
  minio-a:
    <<: *minio
    container_name: pepicloud-minio-a
    hostname: minio-a
    ports: ["127.0.0.1:9101:9000"]
    volumes: ["minio_a_data:/data"]

  # ------------------------------------------- MinIO: copia B (secundaria)
  minio-b:
    <<: *minio
    container_name: pepicloud-minio-b
    hostname: minio-b
    ports: ["127.0.0.1:9102:9000"]
    volumes: ["minio_b_data:/data"]

  # ------------------------------------------- MinIO: backup documental
  minio-backup:
    <<: *minio
    container_name: pepicloud-minio-backup
    hostname: minio-backup
    ports: ["127.0.0.1:9103:9000"]
    volumes: ["minio_backup_data:/data"]

  # ------------------------------- crea los buckets con Object Lock (un solo uso)
  s3-init:
    <<: *app
    container_name: pepicloud-s3-init
    restart: "no"
    command: ["python", "-m", "comun.buckets"]
    environment:
      <<: *app-env
    depends_on:
      minio-a:      {condition: service_healthy}
      minio-b:      {condition: service_healthy}
      minio-backup: {condition: service_healthy}

volumes:
  pg_data:
  pg_backups:
  pg_restore:
  minio_a_data:
  minio_b_data:
  minio_backup_data:

networks:
  pepicloud:
    name: pepicloud

# Docker secrets: cada contenedor los ve como archivos en /run/secrets/<nombre>
secrets:
  pg_admin_password:
    file: ./secrets/pg_admin_password.txt
  pg_replicador_password:
    file: ./secrets/pg_replicador_password.txt
  pg_registro_password:
    file: ./secrets/pg_registro_password.txt
  pg_consulta_password:
    file: ./secrets/pg_consulta_password.txt
  pg_worker_password:
    file: ./secrets/pg_worker_password.txt
  aws_credentials:
    file: ./secrets/aws_credentials
  kms_key_material:
    file: ./secrets/kms_key_material.txt
  api_admin_token:
    file: ./secrets/api_admin_token.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
