# Portal de consulta: solo lectura. Reenvia /api/* SOLO a api-consulta y solo metodos GET.
server {
    listen 80;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        limit_except GET { deny all; }        # POST, PUT, DELETE... -> 403
        set $api http://api-consulta:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
