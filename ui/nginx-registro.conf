# Portal de registro: sirve la pagina y reenvia /api/* SOLO a api-registro
server {
    listen 80;
    server_tokens off;
    client_max_body_size 21m;                 # la API acepta hasta 20 MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS de Docker: sigue a la API si se reinicia

    location /api/ {
        set $api http://api-registro:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
